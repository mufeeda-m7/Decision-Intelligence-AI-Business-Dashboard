<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Analytics | AI Decision Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="sales">
  <div id="shell"></div>

  <main class="container">
    <h2 class="page-title">Sales Analytics</h2>
    <p class="page-sub">Where the money comes from, and where the profit is.</p>

    <section class="grid">
      <div class="card span-6"><h2>Sales vs Profit by Category</h2><div class="chart-box tall"><canvas id="catChart"></canvas></div></div>
      <div class="card span-6"><h2>Sales vs Profit by Region</h2><div class="chart-box tall"><canvas id="regChart"></canvas></div></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
