<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profit Simulator | AI Decision Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="simulator">
  <div id="shell"></div>

  <main class="container">
    <h2 class="page-title">Profit Simulator</h2>
    <p class="page-sub">Pick a product, choose a discount, and let the model predict the profit.</p>

    <section class="grid">
      <div class="card span-5">
        <h2>Scenario</h2>
        <div class="form-row">
          <label for="productSelect">Product</label>
          <select id="productSelect"></select>
        </div>
        <div class="form-row">
          <label for="discountInput">Discount: <strong id="discountValue">10%</strong></label>
          <input type="range" id="discountInput" min="0" max="1" step="0.01" value="0.10" />
        </div>
        <button class="btn" onclick="runSingleSimulation()">Predict Profit</button>
      </div>

      <div class="card span-7">
        <h2>Prediction</h2>
        <div class="label" style="color:#6b7a90;font-size:13px">Predicted profit</div>
        <div class="big-number" id="predictedProfit">-</div>
        <div class="result-line"><span>Baseline sales</span><span id="baselineSales">-</span></div>
        <div class="result-line"><span>Baseline quantity</span><span id="baselineQuantity">-</span></div>
        <div class="result-line"><span>Scenario health score</span><span id="scenarioHealth">-</span></div>
        <div class="bar"><div id="scenarioFill"></div></div>
        <div class="reco" id="recommendation">Run a prediction to see the recommendation.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
